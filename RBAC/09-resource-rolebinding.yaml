apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: nginx-blue-reader-binding
  namespace: homelab

subjects:
  - kind: ServiceAccount
    name: pod-specific-reader
    namespace: homelab

roleRef:
  kind: Role

  name: nginx-blue-only-reader

  apiGroup: rbac.authorization.k8s.io
