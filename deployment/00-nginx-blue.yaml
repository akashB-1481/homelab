apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-blue
  namespace: homelab
  labels:
    app: nginx-blue
spec:
  selector:
    matchLabels:
      app: nginx-blue
  replicas: 3

  template:
    metadata:
      labels:
        app: nginx-blue
    spec:
      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      containers:
        - name: nginx-blue
          image: nginx:latest

          ports:
            - containerPort: 80
              name: nginx-blue
