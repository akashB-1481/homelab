apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-green
  namespace: homelab
  labels:
    app: nginx-green
spec:
  selector:
    matchLabels:
      app: nginx-green
  replicas: 2

  template:
    metadata:
      labels:
        app: nginx-green
    spec:
      # initContainers:
      # Init containers are exactly like regular containers, except:
      # - Init containers always run to completion.
      # - Each init container must complete successfully before the next one starts.
      containers:
        - name: nginx-green
          image: nginx:latest
          volumeMounts:
            - name: nginx-green-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: nginx-green-html
          configMap:
            name: nginx-green-cm

          ports:
            - containerPort: 80
              name: nginx-green
